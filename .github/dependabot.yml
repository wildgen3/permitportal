version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Actions are pinned by commit SHA. Dependabot updates the SHA and the version
    # comment together, which is the only sane way to maintain SHA pinning by hand.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /services/classifier
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directory: /services/resolver
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
