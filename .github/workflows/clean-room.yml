name: clean-room

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a term added to the denylist after a merge is still caught.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Dependabot runs use a SEPARATE secret store, which is deliberately left empty.
      # The scanner therefore exits 2 ("no sensitive terms configured") on every
      # Dependabot pull request -- correct fail-closed behaviour, but a permanent red X.
      #
      # The fix is NOT to put the denylist in the Dependabot secret store. That store is
      # readable by runs triggered by Dependabot's own updates to SHA-pinned actions,
      # which is a supply-chain path this particular secret should not be on: it is the
      # one secret whose disclosure defeats the control it protects.
      #
      # Instead the scan is skipped for Dependabot only. The residual risk is negligible
      # and bounded: Dependabot edits version strings and commit SHAs in
      # .github/workflows and nothing else, and every one of those changes is still
      # scanned by the push-to-main run after merge.
      - name: Scan (skipped for Dependabot — see comment above)
        if: github.actor == 'dependabot[bot]'
        run: echo 'Skipped - Dependabot has no access to the denylist secret by design.'

      - name: Scan
        if: github.actor != 'dependabot[bot]'
        # The term list is a repository secret and is never committed: a plaintext
        # denylist in a public repo discloses exactly what it protects.
        #
        # No --local flag here, deliberately. In CI the scanner reports a count only:
        # this log is world-readable on a public repo, so printing a location would
        # point at a public line and disclose the term by inspection.
        #
        # NEVER convert this workflow to pull_request_target. That would hand the
        # denylist secret to any forked pull request.
        #
        # It exits 2 when no terms are configured, refusing to report a pass without
        # having checked anything.
        env:
          CLEAN_ROOM_DENYLIST: ${{ secrets.CLEAN_ROOM_DENYLIST }}
        run: python3 scripts/clean-room-check.py
