name: docs

on:
  pull_request:
    paths: ['**/*.md', 'docs/**', 'scripts/check-docs.mjs', 'scripts/gen-adr-index.mjs']
  push:
    branches: [main]

# Least privilege. Escalate per job, never here.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Front-matter, ADR references, and internal links
        run: node scripts/check-docs.mjs

      - name: ADR index is in sync
        run: node scripts/gen-adr-index.mjs --check

      # `terraform` is not on the GitHub runner image by default -- without this
      # the step fails with exit 127 "command not found", which reads like a
      # formatting failure but is a missing tool.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Terraform formatting
        # Runs from day one, before any resource exists, so drift never accumulates.
        run: terraform fmt -check -recursive infra/
