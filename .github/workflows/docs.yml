name: docs

on:
  pull_request:
    # NO path filter, deliberately. This is a REQUIRED status check, and a
    # path-filtered workflow never reports on a pull request that does not touch its
    # paths -- so the check sits "expected" forever and the pull request can never
    # merge. A required check must be able to run on every pull request.
  push:
    branches: [main]

# Least privilege. Escalate per job, never here.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Front-matter, ADR references, and internal links
        run: node scripts/check-docs.mjs

      - name: ADR index is in sync
        run: node scripts/gen-adr-index.mjs --check

      # `terraform` is not on the GitHub runner image by default -- without this
      # the step fails with exit 127 "command not found", which reads like a
      # formatting failure but is a missing tool.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Terraform formatting
        # Runs from day one, before any resource exists, so drift never accumulates.
        run: terraform fmt -check -recursive infra/
