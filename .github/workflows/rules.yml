name: rules

on:
  pull_request:
    # NO path filter, deliberately. This is a REQUIRED status check, and a
    # path-filtered workflow never reports on a pull request that does not touch its
    # paths -- so the check sits "expected" forever and the pull request can never
    # merge. A required check must be able to run on every pull request.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Rule integrity and linter L-01 … L-06
        # Validates real, machine-checkable domain content: no cycles in the credential
        # graph, every predicate registered at the declared scope, every entry cited and
        # effective-dated, and no negation over an illustrative list.
        run: python3 scripts/check-rules.py

      - name: Decision-plane purity
        # ADR-0001 is only architecture if it is enforced. Asserts that nothing in
        # packages/rules or services/resolver imports or depends on a model client.
        run: python3 scripts/check-engine-purity.py
