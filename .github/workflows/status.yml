name: status

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Every directory declares an honest status
        # AGENTS.md rule 8. The repository cannot overstate its own completeness.
        run: node scripts/check-status-table.mjs
