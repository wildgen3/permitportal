# Credential chain: what an electrical contractor in Seattle must obtain, and in
# what order.
#
# The requirement tree is where CTDL earns its place. `electrician_certification`
# has a genuine OR: an experience-hours path or an education-plus-reduced-hours
# path. A flat foreign key cannot express that; a recursive tree of AND groups
# containing OR alternative sets can.
#
# Specification fixture. Costs and hour counts are illustrative and are NOT
# represented as current fee schedules; see docs/clean-room.md.
version: 1
jurisdiction: us-wa

credentials:
  - id: cred/us-wa/business-license
    type: registration
    label: Washington State business licence
    issuing_authority: auth/us-wa/revenue
    source_url: https://app.leg.wa.gov/rcw/default.aspx?cite=19.02
    citation: RCW 19.02
    requirements: []

  - id: cred/us-wa/contractor-registration
    type: registration
    label: Contractor registration
    issuing_authority: auth/us-wa/labor-industries
    source_url: https://app.leg.wa.gov/rcw/default.aspx?cite=18.27
    citation: RCW 18.27.020
    requirements:
      - id: req/contractor-registration/root
        node_type: AND_GROUP
        legal_source: RCW 18.27.020
        children:
          - id: req/contractor-registration/business-license
            node_type: LEAF
            edge_kind: prerequisite
            target_credential: cred/us-wa/business-license
            legal_source: RCW 18.27.020
          - id: req/contractor-registration/bond
            node_type: LEAF
            edge_kind: concurrent
            target_predicate: establishment.surety_bond_active
            legal_source: RCW 18.27.040
          - id: req/contractor-registration/insurance
            node_type: LEAF
            edge_kind: concurrent
            target_predicate: establishment.liability_insurance_active
            legal_source: RCW 18.27.050

  - id: cred/us-wa/electrical-contractor
    type: license
    label: Electrical contractor licence
    issuing_authority: auth/us-wa/labor-industries
    source_url: https://app.leg.wa.gov/rcw/default.aspx?cite=19.28
    citation: RCW 19.28.041
    requirements:
      - id: req/electrical-contractor/root
        node_type: AND_GROUP
        legal_source: RCW 19.28.041
        children:
          - id: req/electrical-contractor/contractor-registration
            node_type: LEAF
            edge_kind: prerequisite
            target_credential: cred/us-wa/contractor-registration
            legal_source: RCW 19.28.041
          - id: req/electrical-contractor/administrator
            node_type: LEAF
            edge_kind: prerequisite
            target_credential: cred/us-wa/electrician-certification
            legal_source: RCW 19.28.041

  - id: cred/us-wa/electrician-certification
    type: certification
    label: Electrician certificate of competency
    issuing_authority: auth/us-wa/labor-industries
    source_url: https://app.leg.wa.gov/rcw/default.aspx?cite=19.28
    citation: RCW 19.28.161
    requirements:
      # The AND-of-ORs that motivates the whole reified-requirement design.
      - id: req/electrician-certification/root
        node_type: AND_GROUP
        legal_source: RCW 19.28.161
        children:
          - id: req/electrician-certification/pathway
            node_type: OR_GROUP
            legal_source: RCW 19.28.161
            children:
              - id: req/electrician-certification/experience-path
                node_type: LEAF
                edge_kind: prerequisite
                years_experience: 4
                target_predicate: person.supervised_hours
                legal_source: RCW 19.28.161
              - id: req/electrician-certification/education-path
                node_type: LEAF
                edge_kind: prerequisite
                years_experience: 2
                target_predicate: person.approved_program_completed
                legal_source: RCW 19.28.161
          - id: req/electrician-certification/exam
            node_type: LEAF
            edge_kind: prerequisite
            target_predicate: person.examination_passed
            legal_source: RCW 19.28.161

  - id: cred/us-seattle/business-license
    type: license
    label: Seattle business licence tax certificate
    issuing_authority: auth/us-seattle/finance
    source_url: https://library.municode.com/wa/seattle/codes/municipal_code
    citation: SMC 5.55
    requirements:
      - id: req/seattle-business-license/root
        node_type: AND_GROUP
        legal_source: SMC 5.55
        children:
          - id: req/seattle-business-license/state-license
            node_type: LEAF
            edge_kind: prerequisite
            target_credential: cred/us-wa/business-license
            legal_source: SMC 5.55
