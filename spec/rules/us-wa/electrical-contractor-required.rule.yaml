# State trade credential trigger.
#
# Demonstrates the seam between the rules engine and the credential resolver: the
# rule decides THAT a credential is required; the requirement tree decides what must
# be obtained first.
#
# Note the `not:` here is legal because the exemption list is enumerative_closed and
# complete. The same construct over an illustrative_open list is linter error L-01.
rule: us-wa.electrical_contractor.required
version: 1
scope: establishment
result_semantics: obligation
effective:
  law_from: "1980-01-01"
source_url: https://app.leg.wa.gov/rcw/default.aspx?cite=19.28
citations:
  - id: c1
    cite: RCW 19.28.041
    source: state_code
    as_of: "2026-08-19"

expr:
  all:
    - predicate: activity_in
      scope: establishment
      attribute: establishment.activities
      list_ref: vocab/activity/electrical_work
      list_semantics: enumerative_closed
      cites: [c1]
    - predicate: location_within
      scope: establishment
      attribute: establishment.jurisdiction_path
      jurisdiction_profile_ref: self
      cites: [c1]
    - not:
        predicate: any_of
        scope: establishment
        attribute: establishment.exemption_claims
        list_ref: lists/rcw_19_28_exemptions
        list_semantics: enumerative_closed
        cites: [c1]

jurisdiction_profile:
  main: [us-wa]
  exceptions: []

produces_obligation:
  type: obtain_credential
  credential: cred/us-wa/electrical-contractor

fixtures:
  positive:
    - id: seattle-electrical-contractor
      note: Electrical work in Washington, no exemption claimed.
  negative:
    - id: seattle-remodel-only
      note: Remodeling without electrical work.
